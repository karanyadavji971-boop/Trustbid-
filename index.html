<!DOCTYPE html>
<html lang="en">

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        /* Animated Background */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body { 
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #2e1065, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white; min-height: 100vh; 
            display: flex; flex-direction: column;
        }
        
        .container { max-width: 500px; margin: auto; width: 100%; padding: 15px; flex: 1; display: flex; flex-direction: column; }

        /* Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            color: white;
        }

        /* Login & Setup */
        #loginScreen, #setupScreen { display: none; flex-direction: column; justify-content: center; align-items: center; flex: 1; text-align: center; }
        #mainScreen { display: none; }
        
        h1 { font-size: 32px; font-weight: 900; margin-bottom: 20px; }
        
        .google-btn { display: flex; align-items: center; justify-content: center; background: white; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 700; color: #333; cursor: pointer; width: 100%; margin-top: 20px; }
        
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 5px; display: block; }
        .input-group input { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; outline: none; }

        .religion-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .religion-btn { padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; font-size: 14px; font-weight: 700; color: white; cursor: pointer; }
        .religion-btn.selected { background: #3b82f6; border-color: #3b82f6; }
        
        .save-btn { background: #3b82f6; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; width: 100%; }
        .save-btn:disabled { background: #475569; cursor: not-allowed; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 5px; }
        .header h2 { font-size: 24px; font-weight: 800; }
        .header-actions { display: flex; gap: 8px; }
        .edit-btn, .logout-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .logout-btn { background: #ef4444; border-color: #ef4444; }

        /* Search */
        .search-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .search-row input, .search-row select { padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; outline: none; }
        .search-row input { flex: 1; }
        .search-btn { width: 100%; background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .search-result { margin-top: 15px; display: none; background: rgba(59, 130, 246, 0.2); padding: 15px; border-radius: 8px; border-left: 4px solid #3b82f6; }

        /* Calendar */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 35px; height: 35px; border-radius: 50%; font-size: 18px; font-weight: bold; cursor: pointer; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .day-name { font-size: 11px; font-weight: 700; color: #94a3b8; padding: 5px 0; }
        .day-cell { padding: 8px 0; border-radius: 8px; font-size: 14px; font-weight: 600; position: relative; }
        .day-cell.has-event { color: #fbbf24; }
        .day-cell.has-event::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: #fbbf24; border-radius: 50%; }
        
        /* Events */
        .event-item { background: rgba(255,255,255,0.05); border-left: 4px solid #fbbf24; padding: 12px; margin-bottom: 10px; border-radius: 8px; }
        .event-title { font-size: 15px; font-weight: 700; color: #fbbf24; }
        .event-date { font-size: 12px; color: #94a3b8; font-weight: 600; }

        /* Notes & Alarm */
        .note-item { background: rgba(255,255,255,0.05); border-left: 4px solid #3b82f6; padding: 12px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .note-item .info { flex: 1; }
        .note-item .info p { font-size: 14px; font-weight: 600; }
        .note-item .info span { font-size: 12px; color: #94a3b8; }
        .note-del-btn { background: #ef4444; border: none; color: white; width: 25px; height: 25px; border-radius: 50%; font-size: 12px; cursor: pointer; }
    </style>
</head>

<div class="container">
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" style="display:flex;">
        <div class="glass-card" style="width: 100%;">
            <h1>Unique Calendar</h1>
            <button class="google-btn" onclick="loginWithGoogle()">Sign in with Google</button>
        </div>
    </div>

    <!-- SETUP SCREEN -->
    <div id="setupScreen">
        <div class="glass-card" style="width: 100%;">
            <h2 style="margin-bottom:15px;">Enter Your Details</h2>
            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="setupName" placeholder="Enter your name">
            </div>
            <div class="input-group">
                <label>Select Religion</label>
                <div class="religion-grid">
                    <div class="religion-btn" id="btn-Hindu" onclick="selectSetupReligion('Hindu')">🕉️ Hindu</div>
                    <div class="religion-btn" id="btn-Muslim" onclick="selectSetupReligion('Muslim')">☪️ Muslim</div>
                    <div class="religion-btn" id="btn-Sikh" onclick="selectSetupReligion('Sikh')">🪯 Sikh</div>
                    <div class="religion-btn" id="btn-Christian" onclick="selectSetupReligion('Christian')">✝️ Christian</div>
                </div>
            </div>
            <div class="input-group">
                <label>Date of Birth</label>
                <input type="date" id="setupDOB">
            </div>
            <button class="save-btn" id="saveSetupBtn" onclick="saveSetupData()" disabled>Save & Continue</button>
        </div>
    </div>

    <!-- MAIN SCREEN -->
    <div id="mainScreen">
        <div class="header">
            <h2 id="userNameDisplay">Name</h2>
            <div class="header-actions">
                <button class="edit-btn" onclick="editProfile()">Edit</button>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- SEARCH -->
        <div class="glass-card">
            <h3 style="font-size:16px; margin-bottom:10px;">🔍 Search Festival</h3>
            <div class="search-row">
                <input type="text" id="searchFestival" placeholder="e.g. Diwali">
                <select id="searchYear">
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                    <option value="2029">2029</option>
                    <option value="2030">2030</option>
                </select>
            </div>
            <button class="search-btn" onclick="searchFestival()">Search</button>
            <div id="searchResult" class="search-result"></div>
        </div>

        <!-- CALENDAR -->
        <div class="glass-card">
            <div class="calendar-header">
                <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
                <h3 id="monthYearDisplay"></h3>
                <button class="nav-btn" onclick="changeMonth(1)">❯</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <!-- EVENTS -->
        <div class="glass-card">
            <h3 id="eventsTitle" style="font-size:16px; margin-bottom:15px;">🎉 Events</h3>
            <div id="festivalList"></div>
        </div>

        <!-- NOTES & ALARM -->
        <div class="glass-card">
            <h3 style="font-size:16px; margin-bottom:10px;">🔔 My Notes & Alarms</h3>
            <input type="text" id="noteTitle" placeholder="Note Title" style="width:100%; padding:12px; margin-bottom:10px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.2); border-radius:8px; color:white;">
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <input type="date" id="noteDate" style="flex:1; padding:12px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.2); border-radius:8px; color:white;">
                <input type="time" id="noteTime" style="flex:1; padding:12px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.2); border-radius:8px; color:white;">
            </div>
            <button class="save-btn" onclick="addNote()">Save Note</button>
            <div id="notesList" style="margin-top:15px;"></div>
        </div>
    </div>
</div>

<!-- ALARM POPUP -->
<div id="alarmModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:1000;">

    auth.onAuthStateChanged(async (user) => {

            currentUser = user;
            const userDoc = await db.collection("users").doc(user.uid).get();
            
            if (userDoc.exists && userDoc.data().religion) {
                userData = userDoc.data();
                await loadFestivals(); 
                await loadNotes();
                showMainScreen();
            } else {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("setupScreen").style.display = "flex";
            }

            currentUser = null;
            document.getElementById("loginScreen").style.display = "flex";
            document.getElementById("setupScreen").style.display = "none";
            document.getElementById("mainScreen").style.display = "none";
        }
    });

    async function loadFestivals() {
        try {
            const snapshot = await db.collection("festivals").get();
            allFestivals = [];
            snapshot.forEach(doc => allFestivals.push(doc.data()));
            if (allFestivals.length === 0) allFestivals = defaultFestivals;
        } catch (e) {
            allFestivals = defaultFestivals;
        }
    }

    async function loadNotes() {
        if(!currentUser) return;
        try {
            const snapshot = await db.collection("notes").where("userId", "==", currentUser.uid).get();
            myNotes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderNotes();
        } catch (e) { console.log(e); }
    }

        try {
            await db.collection("users").doc(currentUser.uid).set({
                name, religion: selectedSetupReligion, dob, email: currentUser.email
            });
            userData = { name, religion: selectedSetupReligion, dob };
            await loadFestivals();
            await loadNotes();
            showMainScreen();
        } catch (e) { alert("Error: " + e.message); }
    };

    // ================= UI LOGIC =================
    function showMainScreen() {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("setupScreen").style.display = "none";
        document.getElementById("mainScreen").style.display = "block";

        document.getElementById("userNameDisplay").innerText = userData.name || "Name";

        const theme = themes[userData.religion] || themes['Hindu'];
        document.documentElement.style.setProperty('--primary', theme.primary);
        document.documentElement.style.setProperty('--primary-light', theme.light);

        renderCalendar();
    }

    window.editProfile = function() {
        document.getElementById("mainScreen").style.display = "none";
        document.getElementById("setupScreen").style.display = "flex";
        document.getElementById("setupName").value = userData.name;
        document.getElementById("setupDOB").value = userData.dob;
        selectSetupReligion(userData.religion);
        document.getElementById("saveSetupBtn").innerText = "Update Profile";
    };

    // ================= CALENDAR =================
    function renderCalendar() {
        const grid = document.getElementById("calendarGrid");
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        
        document.getElementById("monthYearDisplay").innerText = `${monthNames[currentMonth]} ${currentYear}`;
        document.getElementById("eventsTitle").innerText = `🎉 Events in ${monthNames[currentMonth]} ${currentYear}`;

        grid.innerHTML = "";
        ["S", "M", "T", "W", "T", "F", "S"].forEach(d => grid.innerHTML += `<div class="day-name">${d}</div>`);

        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

        let monthEvents = allFestivals.filter(f => {
            if(!f.date) return false;
            if(f.religion !== userData.religion && f.religion !== 'All') return false;
            let d = new Date(f.date);
            return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
        });

        for(let i=0; i<firstDay; i++) grid.innerHTML += `<div></div>`;

        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const hasEvent = monthEvents.some(e => e.date === dateStr);
            grid.innerHTML += `<div class="day-cell ${hasEvent?'has-event':''}">${d}</div>`;
        }
        renderEventList(monthEvents);
    }

    function renderEventList(events) {
        const list = document.getElementById("festivalList");
        list.innerHTML = "";
        if(events.length === 0) {
            list.innerHTML = "<p style='font-size:14px; color:#94a3b8;'>No festivals this month.</p>";
            return;
        }
        events.forEach(f => {
            let displayDate = f.date.split('-').reverse().join('/');
            list.innerHTML += `
                <div class="event-item">
                    <div class="event-title">${f.name}</div>
                    <div class="event-date">📅 ${displayDate}</div>
                </div>
            `;
        });
    }

    window.changeMonth = function(dir) {
        currentMonth += dir;
        if(currentMonth > 11) { currentMonth = 0; currentYear++; }
        if(currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCalendar();
    };

    // ================= SEARCH =================
    window.searchFestival = function() {
        const term = document.getElementById("searchFestival").value.trim().toLowerCase();
        const year = document.getElementById("searchYear").value;
        const resultBox = document.getElementById("searchResult");
        if(!term) return alert("Please enter festival name!");

        const results = allFestivals.filter(f => {
            if(!f.date) return false;
            if(f.religion !== userData.religion && f.religion !== 'All') return false;
            let dateObj = new Date(f.date);
            return f.name.toLowerCase().includes(term) && dateObj.getFullYear().toString() === year;
        });

        if(results.length > 0) {
            let html = "";
            results.forEach(r => {
                let d = new Date(r.date);
                let dayName = d.toLocaleDateString('en-IN', { weekday: 'long' });
                let formattedDate = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
                html += `<p style="margin-bottom:8px;">📅 <b>${formattedDate}</b> (${dayName})</p>`;
            });
            resultBox.innerHTML = html;
        } else {
            resultBox.innerHTML = "<p style='color:#ef4444;'>No festival found.</p>";
        }
        resultBox.style.display = "block";
    };

    // ================= NOTES & ALARM =================
    window.addNote = async function() {
        const title = document.getElementById("noteTitle").value.trim();
        const date = document.getElementById("noteDate").value;
        const time = document.getElementById("noteTime").value;
        if(!title || !date || !time) return alert("Please fill all fields!");

        try {
            await db.collection("notes").add({
                userId: currentUser.uid,
                title, date, time
            });
            document.getElementById("noteTitle").value = "";
            document.getElementById("noteDate").value = "";
            document.getElementById("noteTime").value = "";
            loadNotes();
        } catch (e) { alert("Error: " + e.message); }
    };

    window.deleteNote = async function(id) {
        if(!confirm("Delete this note?")) return;
        try {
            await db.collection("notes").doc(id).delete();
            loadNotes();
        } catch (e) { alert(e.message); }
    };

    function renderNotes() {
        const list = document.getElementById("notesList");
        list.innerHTML = "";
        if(myNotes.length === 0) {
            list.innerHTML = "<p style='font-size:12px; color:#94a3b8;'>No notes yet.</p>";
            return;
        }
        myNotes.forEach(n => {
            list.innerHTML += `
                <div class="note-item">
                    <div class="info">
                        <p>${n.title}</p>
                        <span>📅 ${n.date} ⏰ ${n.time}</span>
                    </div>
                    <button class="note-del-btn" onclick="deleteNote('${n.id}')">✕</button>
                </div>
            `;
        });
    }

    // Alarm Check (Every 10 seconds)
    setInterval(() => {
        const now = new Date();
        const currentDate = now.toISOString().slice(0, 10);
        const currentTime = now.toTimeString().slice(0, 5);

        myNotes.forEach(n => {
            if(n.date === currentDate && n.time === currentTime) {
                if(!n.triggered) {
                    n.triggered = true;
                    document.getElementById("alarmText").innerText = n.title;
                    document.getElementById("alarmModal").style.display = "flex";
                    // Play Beep
                    try {
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const osc = ctx.createOscillator();
                        osc.type = 'square';
                        osc.frequency.value = 800;
                        osc.connect(ctx.destination);
                        osc.start();
                        setTimeout(() => osc.stop(), 2000);
                    } catch(e) {}
                }
            }
        });
    }, 10000);

</script>

</body>
</html>
