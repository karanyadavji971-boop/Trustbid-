<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unique Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        /* Animated Unique Background */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body { 
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #2e1065, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white; min-height: 100vh; padding: 15px; 
        }
        
        .container { max-width: 500px; margin: auto; }

        /* Glassmorphism Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            color: white;
        }

        /* Login & Setup */
        #loginScreen, #setupScreen { display: none; flex-direction: column; justify-content: center; flex: 1; text-align: center; }
        #mainScreen { display: none; }
        
        h1 { font-size: 32px; font-weight: 900; letter-spacing: -1px; margin-bottom: 20px; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        
        .google-btn { display: flex; align-items: center; justify-content: center; background: white; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 700; color: #333; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.3s; }
        .google-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 5px; display: block; }
        .input-group input { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; outline: none; font-size: 15px; }
        .input-group input:focus { border-color: #3b82f6; }

        .religion-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .religion-btn { padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; font-size: 14px; font-weight: 700; color: white; cursor: pointer; transition: 0.2s; }
        .religion-btn.selected { background: #3b82f6; border-color: #3b82f6; }
        
        .save-btn { background: #3b82f6; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; width: 100%; transition: 0.3s; }
        .save-btn:disabled { background: #475569; cursor: not-allowed; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 5px; }
        .header h2 { font-size: 24px; font-weight: 800; }
        .edit-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; }

        /* Search Box */
        .search-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .search-row input { flex: 1; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; outline: none; }
        .search-row select { width: 100px; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; outline: none; }
        .search-btn { width: 100%; background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .search-result { margin-top: 15px; display: none; background: rgba(59, 130, 246, 0.2); padding: 15px; border-radius: 8px; border-left: 4px solid #3b82f6; }

        /* Calendar */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 35px; height: 35px; border-radius: 50%; font-size: 18px; font-weight: bold; cursor: pointer; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .day-name { font-size: 11px; font-weight: 700; color: #94a3b8; padding: 5px 0; }
        .day-cell { padding: 8px 0; border-radius: 8px; font-size: 14px; font-weight: 600; position: relative; color: #e2e8f0; }
        .day-cell.today { background: #3b82f6; color: white; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .day-cell.has-event { color: #fbbf24; }
        .day-cell.has-event::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: #fbbf24; border-radius: 50%; }
        
        /* Event List */
        .event-item { background: rgba(255,255,255,0.05); border-left: 4px solid #fbbf24; padding: 12px; margin-bottom: 10px; border-radius: 8px; }
        .event-title { font-size: 15px; font-weight: 700; color: #fbbf24; }
        .event-wish { font-size: 14px; margin: 5px 0; color: #e2e8f0; }
        .event-date { font-size: 12px; color: #94a3b8; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- 1. LOGIN SCREEN -->
    <div id="loginScreen" style="display:flex;">
        <div class="glass-card">
            <h1>Unique Calendar</h1>
            <button class="google-btn" onclick="loginWithGoogle()">Sign in with Google</button>
        </div>
    </div>

    <!-- 2. SETUP SCREEN -->
    <div id="setupScreen">
        <div class="glass-card">
            <h2 style="margin-bottom:15px;">Apni Details Bharein</h2>
            
            <div class="input-group">
                <label>Apna Naam</label>
                <input type="text" id="setupName" placeholder="Enter your name">
            </div>

            <div class="input-group">
                <label>Apna Dharm Chunein</label>
                <div class="religion-grid">
                    <div class="religion-btn" id="btn-Hindu" onclick="selectSetupReligion('Hindu')">🕉️ Hindu</div>
                    <div class="religion-btn" id="btn-Muslim" onclick="selectSetupReligion('Muslim')">☪️ Muslim</div>
                    <div class="religion-btn" id="btn-Sikh" onclick="selectSetupReligion('Sikh')">🪯 Sikh</div>
                    <div class="religion-btn" id="btn-Christian" onclick="selectSetupReligion('Christian')">✝️ Christian</div>
                </div>
            </div>

            <div class="input-group">
                <label>Date of Birth</label>
                <input type="date" id="setupDOB">
            </div>

            <button class="save-btn" id="saveSetupBtn" onclick="saveSetupData()" disabled>Save & Continue</button>
        </div>
    </div>

    <!-- 3. MAIN CALENDAR APP -->
    <div id="mainScreen">
        <div class="header">
            <h2>Unique Calendar</h2>
            <button class="edit-btn" onclick="editProfile()">Edit Profile</button>
        </div>

        <!-- SEARCH BOX -->
        <div class="glass-card">
            <h3 style="font-size:16px; margin-bottom:10px;">🔍 Search Tyohar</h3>
            <div class="search-row">
                <input type="text" id="searchFestival" placeholder="e.g. Diwali">
                <select id="searchYear">
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                    <option value="2029">2029</option>
                    <option value="2030">2030</option>
                </select>
            </div>
            <button class="search-btn" onclick="searchFestival()">Search</button>
            <div id="searchResult" class="search-result"></div>
        </div>

        <!-- CALENDAR -->
        <div class="glass-card">
            <div class="calendar-header">
                <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
                <h3 id="monthYearDisplay"></h3>
                <button class="nav-btn" onclick="changeMonth(1)">❯</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <!-- EVENTS -->
        <div class="glass-card">
            <h3 id="eventsTitle" style="font-size:16px; margin-bottom:15px;">🎉 Events</h3>
            <div id="festivalList"></div>
        </div>
    </div>

</div>

<script>
    // ================= FIREBASE CONFIGURATION =================
    const firebaseConfig = {
        apiKey: "AIzaSyDLGmIPpKC0pYFEv1-4OS7idMuXMFuFi9A",
        authDomain: "my-new-calendar-app-13d6d.firebaseapp.com",
        projectId: "my-new-calendar-app-13d6d",
        storageBucket: "my-new-calendar-app-13d6d.firebasestorage.app",
        messagingSenderId: "649457734777",
        appId: "1:649457734777:web:cc79e409a26fcc304ff0a8"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const provider = new firebase.auth.GoogleAuthProvider();

    let currentUser = null;
    let userData = null;
    let allFestivals = []; 
    let selectedSetupReligion = "";
    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();

    const themes = {
        'Hindu': { primary: '#f97316', light: 'rgba(249, 115, 22, 0.2)' }, 
        'Muslim': { primary: '#22c55e', light: 'rgba(34, 197, 94, 0.2)' }, 
        'Sikh': { primary: '#eab308', light: 'rgba(234, 179, 8, 0.2)' }, 
        'Christian': { primary: '#94a3b8', light: 'rgba(148, 163, 184, 0.2)' } 
    };

    // ================= AUTH & DATA LOADING =================
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            const userDoc = await db.collection("users").doc(user.uid).get();
            
            if (userDoc.exists && userDoc.data().religion) {
                userData = userDoc.data();
                await loadFestivals(); 
                showMainScreen();
            } else {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("setupScreen").style.display = "flex";
            }
        } else {
            currentUser = null;
            document.getElementById("loginScreen").style.display = "flex";
            document.getElementById("setupScreen").style.display = "none";
            document.getElementById("mainScreen").style.display = "none";
        }
    });

    // ================= FIREBASE DATA =================
    async function loadFestivals() {
        try {
            const snapshot = await db.collection("festivals").get();
            allFestivals = [];
            snapshot.forEach(doc => {
                allFestivals.push(doc.data());
            });
        } catch (e) {
            console.log("Error loading festivals: " + e.message);
        }
    }

    // ================= LOGIN & SETUP =================
    window.loginWithGoogle = async function() {
        try { await auth.signInWithPopup(provider); } 
        catch (e) { alert("Login Failed: " + e.message); }
    };

    window.selectSetupReligion = function(religion) {
        selectedSetupReligion = religion;
        document.querySelectorAll('.religion-btn').forEach(btn => btn.classList.remove('selected'));
        document.getElementById('btn-' + religion).classList.add('selected');
        checkSetupReady();
    };

    window.checkSetupReady = function() {
        const name = document.getElementById("setupName").value.trim();
        const dob = document.getElementById("setupDOB").value;
        document.getElementById("saveSetupBtn").disabled = !(selectedSetupReligion && dob && name);
    };

    // Attach event listeners for inputs
    document.getElementById("setupName").addEventListener('input', checkSetupReady);
    document.getElementById("setupDOB").addEventListener('change', checkSetupReady);

    window.saveSetupData = async function() {
        const name = document.getElementById("setupName").value.trim();
        const dob = document.getElementById("setupDOB").value;
        if(!selectedSetupReligion || !dob || !name) return;

        try {
            await db.collection("users").doc(currentUser.uid).set({
                name: name,
                religion: selectedSetupReligion,
                dob: dob,
                email: currentUser.email
            });
            userData = { name: name, religion: selectedSetupReligion, dob: dob };
            await loadFestivals();
            showMainScreen();
        } catch (e) { alert("Error: " + e.message); }
    };

    // ================= UI LOGIC =================
    function showMainScreen() {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("setupScreen").style.display = "none";
        document.getElementById("mainScreen").style.display = "block";

        const theme = themes[userData.religion];
        document.documentElement.style.setProperty('--primary', theme.primary);
        document.documentElement.style.setProperty('--primary-light', theme.light);

        renderCalendar();
    }

    window.editProfile = function() {
        document.getElementById("mainScreen").style.display = "none";
        document.getElementById("setupScreen").style.display = "flex";
        
        // Pre-fill existing data
        document.getElementById("setupName").value = userData.name;
        document.getElementById("setupDOB").value = userData.dob;
        selectSetupReligion(userData.religion);
        
        // Change Button Text
        document.getElementById("saveSetupBtn").innerText = "Update Profile";
    };

    // ================= CALENDAR =================
    function renderCalendar() {
        const grid = document.getElementById("calendarGrid");
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        
        document.getElementById("monthYearDisplay").innerText = `${monthNames[currentMonth]} ${currentYear}`;
        document.getElementById("eventsTitle").innerText = `🎉 Events in ${monthNames[currentMonth]} ${currentYear}`;

        grid.innerHTML = "";
        ["S", "M", "T", "W", "T", "F", "S"].forEach(d => grid.innerHTML += `<div class="day-name">${d}</div>`);

        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

        // Filter events based on Religion and Month
        let monthEvents = allFestivals.filter(f => {
            if(!f.date || f.religion !== userData.religion) return false;
            let d = new Date(f.date);
            return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
        });

        for(let i=0; i<firstDay; i++) grid.innerHTML += `<div></div>`;

        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const hasEvent = monthEvents.some(e => e.date === dateStr);
            
            let classes = "day-cell";
            if(hasEvent) classes += " has-event";

            grid.innerHTML += `<div class="${classes}">${d}</div>`;
        }

        renderEventList(monthEvents);
    }

    function renderEventList(events) {
        const list = document.getElementById("festivalList");
        list.innerHTML = "";
        if(events.length === 0) {
            list.innerHTML = "<p style='font-size:14px; color:#94a3b8;'>Koi tyohar nahi hai.</p>";
            return;
        }
        events.forEach(f => {
            let displayDate = f.date.split('-').reverse().join('/');
            list.innerHTML += `
                <div class="event-item">
                    <div class="event-title">${f.name}</div>
                    <div class="event-date">📅 ${displayDate}</div>
                    <div class="event-wish">${f.wish}</div>
                </div>
            `;
        });
    }

    window.changeMonth = function(dir) {
        currentMonth += dir;
        if(currentMonth > 11) { currentMonth = 0; currentYear++; }
        if(currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCalendar();
    };

    // ================= SEARCH LOGIC =================
    window.searchFestival = function() {
        const term = document.getElementById("searchFestival").value.trim().toLowerCase();
        const year = document.getElementById("searchYear").value;
        const resultBox = document.getElementById("searchResult");

        if(!term) return alert("Tyohar ka naam likhein!");

        const results = allFestivals.filter(f => {
            if(!f.date || f.religion !== userData.religion) return false;
            let dateObj = new Date(f.date);
            return f.name.toLowerCase().includes(term) && dateObj.getFullYear().toString() === year;
        });

        if(results.length > 0) {
            let html = "";
            results.forEach(r => {
                let d = new Date(r.date);
                let dayName = d.toLocaleDateString('en-IN', { weekday: 'long' });
                let formattedDate = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
                html += `<p>📅 <b>${formattedDate}</b> (${dayName})</p>`;
            });
            resultBox.innerHTML = html;
        } else {
            resultBox.innerHTML = "<p style='color:#ef4444;'>Is saal ka koi tyohar nahi mila.</p>";
        }
        resultBox.style.display = "block";
    };
</script>

</body>
</html>
